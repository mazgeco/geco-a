<p-dialog
  [header]="catalogService.catalogoActual()?.titulo"
  [visible]="catalogService.visible()"
  (visibleChange)="catalogService.visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '400px' }"
>
  <div class="flex flex-column gap-3">
    <div>
      <label class="block mb-2">
        {{ catalogService.catalogoActual()?.campoDescripcion }}
      </label>

      <input pInputText class="w-full" [(ngModel)]="descripcion" />
    </div>

    <div class="flex justify-content-end gap-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="cerrar()" />
      <p-button label="Guardar" icon="pi pi-check" (onClick)="guardar()" />
    </div>
  </div>
</p-dialog>
