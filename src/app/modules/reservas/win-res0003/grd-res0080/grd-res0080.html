<p-toast />
<p-confirmdialog />
<div class="col-12" class="border-1 border-200 border-round p-3">
  <span>Guías</span>
  <p-toolbar>
    <ng-template #start>
      <p-button
        id="btnGrdRes00801"
        icon="pi pi-plus"
        class="mr-1"
        label="Insertar"
        pTooltip="Inserta una fila"
        tooltipPosition="bottom"
        (onClick)="insertarFila()"
      />
      <p-button
        id="btnGrdRes00802"
        icon="pi pi-trash"
        class="mr-1"
        label="Eliminar"
        pTooltip="Elimina varias filas seleccionadas"
        tooltipPosition="bottom"
        (onClick)="eliminarVarias()"
      />
      <p-button
        id="btnGrdRes00803"
        icon="pi pi-refresh"
        class="mr-1"
        pTooltip="Refresca los datos del grid"
        tooltipPosition="bottom"
        (onClick)="cargaDatos(idReserva)"
      />
      <p-button
        id="btnGrdRes00804"
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
        (onClick)="muestraAuditoriaRegistro()"
      />
      <p-button
        id="btnGrdRes00805"
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())"
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      @if (barraMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="barraMessage()!.severity" [icon]="barraMessage()!.icon">
            {{ barraMessage()!.text }}
          </p-message>
        </div>
      }
    </ng-template>
  </p-toolbar>
  <!-- ===================================== -->
  <!-- LISTADO DE DATOS -->
  <!-- ===================================== -->
  <p-table
    id="grdRes0080"
    [value]="filas()"
    editMode="row"
    selectionMode="multiple"
    [(selection)]="selectedRows"
    [metaKeySelection]="metaKey"
    dataKey="_rowId"
    class="p-datatable-sm"
    [paginator]="true"
    [rows]="3"
    showGridlines
    [size]="'small'"
  >
    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 80%">Proveedor</th>
        <th style="width: 20%"></th>
      </tr>
    </ng-template>
    <!-- BODY -->
    <ng-template pTemplate="body" let-rowData let-editing="editing" let-rowIndex="rowIndex">
      <tr [pEditableRow]="rowData" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
        <!-- DESCRIPCIÓN -->
        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <p-autocomplete
                class="w-full"
                [fluid]="true"
                [(ngModel)]="rowData.razonSocial"
                [ngModelOptions]="{standalone: true}"
                [suggestions]="proveedores()"
                (completeMethod)="buscarProveedores($event)"
                (onSelect)="seleccionarProveedor($event, rowData)"
                optionLabel="nombrePersona"
                optionValue="idProveedor"
                [minLength]="3"
              >
              </p-autocomplete>
            </ng-template>
            <ng-template pTemplate="output">
              {{ rowData.razonSocial }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- ACCIONES -->
        <td class="text-center">
          <!-- EDITAR -->
          @if (!editing) {
            <button
              pButton
              [id]="'btnGrdRes00806' + rowIndex"
              pInitEditableRow
              icon="pi pi-pencil"
              text
              rounded
              severity="primary"
            ></button>
            <button
              pButton
              [id]="'btnGrdRes00807' + rowIndex"
              icon="pi pi-trash"
              text
              rounded
              severity="danger"
              (click)="eliminarFila(rowData)"
            ></button>
          }
          <!-- GUARDAR / CANCELAR -->
          @if (editing) {
            <button
              pButton
              [id]="'btnGrdRes00808' + rowIndex"
              pSaveEditableRow
              icon="pi pi-check"
              text
              rounded
              severity="success"
              class="mr-1"
              (click)="saveRow(rowData)"
            ></button>
            <button
              pButton
              [id]="'btnGrdRes00809' + rowIndex"
              pCancelEditableRow
              icon="pi pi-times"
              text
              rounded
              severity="danger"
            ></button>
          }
        </td>
      </tr>
    </ng-template>
    <!-- FOOTER -->
    <ng-template class="p-0" pTemplate="paginatorleft"> {{ filas().length }} ítems </ng-template>
  </p-table>
</div>
