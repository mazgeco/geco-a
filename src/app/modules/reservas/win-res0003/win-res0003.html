<p-toolbar>
  <ng-template #start>
    <label class="font-bold">
      {{ stateService.codigo() }}
    </label>
  </ng-template>
  <ng-template #center>
    <label class="font-bold topName">
      {{ stateService.nombre() }}
    </label>
  </ng-template>
  <ng-template #end>
    <label class="font-bold" [style.color]="stateService.estado() ? '#4caf50' : '#f44336'">
      {{ stateService.estadoNombre() }}
    </label>
  </ng-template>
</p-toolbar>

<p-tabs value="0">
  <p-tablist>
    <p-tab value="0">Reserva</p-tab>
    <p-tab value="1">Productos</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="0">
      <app-frm-res0003 [idReserva]="idReserva()" (reservaGuardada)="reservaGuardada($event)"></app-frm-res0003>
    </p-tabpanel>
    <p-tabpanel value="1">
      <app-grd-res0021 [idReserva]="idReserva()"></app-grd-res0021>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
