<p-toolbar>
  <ng-template #start>
    <label class="font-bold">
      {{ stateService.codigo() }}
    </label>
  </ng-template>
  <ng-template #center>
    <label class="font-bold topName">
      {{ stateService.nombre() }}
    </label>
  </ng-template>
  <ng-template #end>
    <label class="font-bold" [style.color]="stateService.estado() ? '#4caf50' : '#f44336'">
      {{ stateService.estadoNombre() }}
    </label>
  </ng-template>
</p-toolbar>



<p-tabs value="0">
  <p-tablist>
    <p-tab value="0">Reserva</p-tab>
    <p-tab value="1">Productos</p-tab>
    <p-tab value="2">Archivos</p-tab>
    <p-tab value="3">Guías</p-tab>
    <p-tab value="4">Observaciones generales</p-tab>
    <p-tab value="5">Observaciones proveedores</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="0">
      <app-frm-res0003 [idReserva]="idReserva()"></app-frm-res0003>
    </p-tabpanel>
    <p-tabpanel value="1"></p-tabpanel>
    <p-tabpanel value="2"></p-tabpanel>
    <p-tabpanel value="3"></p-tabpanel>
    <p-tabpanel value="4"></p-tabpanel>
    <p-tabpanel value="5"></p-tabpanel>
  </p-tabpanels>
</p-tabs>
