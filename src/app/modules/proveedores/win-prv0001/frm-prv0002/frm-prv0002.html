<p-toast />
<p-confirmdialog />

<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      @if (esActivo()) {
        <p-button
          icon="pi pi-check"
          class="mr-1"
          label="Inactivar"
          pTooltip="Inactiva al producto"
          tooltipPosition="bottom"
        />
      } @else {
        <p-button
          icon="pi pi-check"
          class="mr-1"
          label="Activar"
          pTooltip="Activa al producto"
          tooltipPosition="bottom"
        />
      }
      <p-button
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraAuditoria(idProveedor, idTabla(), currentData)"
      />
      <p-button
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())"
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      @if (proveedorMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="proveedorMessage()!.severity" [icon]="proveedorMessage()!.icon">
            {{ proveedorMessage()!.text }}
          </p-message>
        </div>
      }
    </ng-template>
  </p-toolbar>
</div>

<form id="frmPrv0002" class="grid m-0" [formGroup]="frmPrv0002">
  <p-panel class="col-12">
    <div class="grid">
      <!-- ======================= -->
      <!-- FILA 1 -->
      <!-- ======================= -->
      <div class="col-12">
        <div class="field mb-1">
          <label>Razon social <span class="asterisco">*</span></label>
          <input pInputText class="w-full" formControlName="razonSocial" />
        </div>
      </div>
      <!-- ======================= -->
      <!-- FILA 2 -->
      <!-- ======================= -->
      <div class="col-12">
        <div class="field mb-1">
          <label>Nombre comercial <span class="asterisco">*</span></label>
          <input pInputText class="w-full" formControlName="nombreComercial">
        </div>
      </div>
      <!-- ======================= -->
      <!-- FILA 3 -->
      <!-- ======================= -->
      <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Código</label>
          <input pInputText class="w-full" formControlName="idProveedor" [readOnly]="true" />
        </div>
      </div>
      <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Estado</label>
          <!-- TODO: Poner aquí el estado -->
           <input pInputText class="w-full" formControlName="estadoProveedor" />
        </div>
      </div>
       <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Tipo Persona</label>
           <input pInputText class="w-full" formControlName="tipoPersona" />
        </div>
      </div>
        <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Correo Electrónico<span class="asterisco">*</span></label>
           <input pInputText class="w-full" formControlName="email" />
        </div>
      </div>
            <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Tipo de Identificación<span class="asterisco">*</span></label>
           <input pInputText class="w-full" formControlName="tipoIdentificacion" />
        </div>
      </div>
      <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Identificación<span class="asterisco">*</span></label>
           <input pInputText class="w-full" formControlName="identificacion" />
        </div>
      </div>
            <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Teléfono<span class="asterisco">*</span></label>
           <input pInputText class="w-full" formControlName="telefono" />
        </div>
      </div>
                  <div class="col-12 md:col-6">
        <div class="field mb-1">
          <label>Dirección<span class="asterisco">*</span></label>
           <input pInputText class="w-full" formControlName="direccion" />
        </div>
      </div>
    </div>
  </p-panel>
</form>
