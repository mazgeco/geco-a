<p-toast />
<p-confirmdialog />

<p-toolbar>
  <ng-template #start>
    <label class="font-bold">
      COD. {{ idProveedor() }}
    </label>
  </ng-template>
  <ng-template #center>
    <label class="font-bold topName">
      {{ stateService.nombre() }}
    </label>
  </ng-template>
  <ng-template #end>
    <label class="font-bold" [style.color]="stateService.estado() ? '#4caf50' : '#f44336'">
      {{ stateService.estadoNombre() }}
    </label>
  </ng-template>
</p-toolbar>

    <p-tab value="2">Telefonos</p-tab>
    <p-tab value="3">Ficha medica</p-tab>
    <p-tab value="4">Identificaciones</p-tab>
  </p-tablist>
  <p-tabpanels>
