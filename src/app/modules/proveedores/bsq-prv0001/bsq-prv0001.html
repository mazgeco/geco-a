<p-toolbar>
  <ng-template #start>
    <p-button label="Nuevo" (onClick)="openProveedor()"></p-button>
  </ng-template>
  <ng-template #center>
    <p-iconfield iconPosition="left">
      <p-inputicon class="pi pi-search" />
      <input type="text" pInputText placeholder="Search" />
    </p-iconfield>
  </ng-template>
  <ng-template #end>
    <span></span>
  </ng-template>
</p-toolbar>

<div class="grid m-3">
  @for (proveedor of proveedores(); track proveedor.idProveedor) {
  <div class="col-12 md:col-6 lg:col-4 xl:col-3">
    <p-card class="resultado-card h-full cursor-pointer" (click)="seleccionarProveedor(proveedor)">
      <ng-template #title>
        <div class="font-semibold text-sm">
          {{ proveedor.nombreProveedor }}
        </div>
      </ng-template>
      <div class="text-sm">
        <div>
          <span class="font-semibold">Código:</span>
          {{ proveedor.idProveedor }}
        </div>
        <div>
          {{ proveedor.estadoProveedor }}
        </div>
      </div>
    </p-card>
  </div>
  }
</div>
