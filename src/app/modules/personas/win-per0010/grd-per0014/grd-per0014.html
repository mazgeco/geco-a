<p-toast />
<p-confirmdialog />
<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      <p-button
        id="btnGrdPer00201"
        icon="pi pi-plus"
        class="mr-1"
        label="Insertar"
        pTooltip="Inserta una fila"
        tooltipPosition="bottom"
        (onClick)="insertarFila()"
      />
      <p-button
        id="btnGrdPer00202"
        icon="pi pi-trash"
        class="mr-1"
        label="Eliminar"
        pTooltip="Elimina varias filas seleccionadas"
        tooltipPosition="bottom"
        (onClick)="eliminarVarias()"
      />
      <p-button
        id="btnGrdPer00203"
        icon="pi pi-refresh"
        class="mr-1"
        pTooltip="Refresca los datos del grid"
        tooltipPosition="bottom"
        (onClick)="cargaDatos()"
      />
      <p-button
        id="btnGrdPer00204"
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
        (onClick)="muestraAuditoriaRegistro()"
      />
      <p-button
        id="btnGrdPer00205"
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())"
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      @if (barraMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="barraMessage()!.severity" [icon]="barraMessage()!.icon">
            {{ barraMessage()!.text }}
          </p-message>
        </div>
      }
    </ng-template>
  </p-toolbar>
  <!-- ===================================== -->
  <!-- LISTADO DE DATOS -->
  <!-- ===================================== -->
  <p-table
    id="grdPer0020"
    [value]="filas()"
    editMode="row"
    selectionMode="multiple"
    [(selection)]="selectedRows"
    [metaKeySelection]="metaKey"
    dataKey="_rowId"
    class="p-datatable-sm"
    [paginator]="true"
    [rows]="10"
    showGridlines
    [size]="'small'"
  >
    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 35%">País</th>
        <th style="width: 35%">Nombre provincia</th>
        <th style="width: 20%">Código de área</th>
        <th style="width: 10%"></th>
      </tr>
    </ng-template>
    <!-- BODY -->
    <ng-template pTemplate="body" let-rowData let-editing="editing" let-rowIndex="rowIndex">
      <tr [pEditableRow]="rowData" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
        <!-- PAÍS -->
        <td>
          <p-cellEditor>
            <!-- INPUT -->
            <ng-template pTemplate="input">
              <p-select
                [options]="paises()"
                optionLabel="descripcionPais"
                optionValue="idPais"
                [(ngModel)]="rowData.idPais"
                [filter]="true"
                placeholder="Seleccione"
                class="w-full"
                appendTo="body"
              />
            </ng-template>
            <!-- OUTPUT -->
            <ng-template pTemplate="output">
              {{ funciones.obtenerEtiqueta(paises(), rowData.idPais, 'pais') }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- NOMBRE PROVINCIA -->
        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input
                pInputText
                type="text"
                [(ngModel)]="rowData.descripcionProvincia"
                class="w-full"
              />
            </ng-template>
            <ng-template pTemplate="output">
              {{ rowData.descripcionProvincia }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- CÓDIGO DE ÁREA -->
        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input pInputText type="text" [(ngModel)]="rowData.codigoArea" class="w-full" />
            </ng-template>
            <ng-template pTemplate="output">
              {{ rowData.codigoArea }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- ACCIONES -->
        <td class="text-center">
          <!-- EDITAR -->
          @if (!editing) {
            <button
              pButton
              [id]="'btnGrdPer00206' + rowIndex"
              pInitEditableRow
              icon="pi pi-pencil"
              text
              rounded
              severity="primary"
            ></button>
            <button
              pButton
              [id]="'btnGrdPer00207' + rowIndex"
              icon="pi pi-trash"
              text
              rounded
              severity="danger"
              (click)="eliminarFila(rowData)"
            ></button>
          }
          <!-- GUARDAR / CANCELAR -->
          @if (editing) {
            <button
              pButton
              [id]="'btnGrdPer00208' + rowIndex"
              pSaveEditableRow
              icon="pi pi-check"
              text
              rounded
              severity="success"
              class="mr-1"
              (click)="saveRow(rowData)"
            ></button>
            <button
              pButton
              [id]="'btnGrdPer00209' + rowIndex"
              pCancelEditableRow
              icon="pi pi-times"
              text
              rounded
              severity="danger"
            ></button>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
