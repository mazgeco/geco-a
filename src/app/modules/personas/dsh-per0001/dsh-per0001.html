<div class="grid w-full mt-1">
  <div class="col-12 md:col-6 lg:col-4">
    @if(isLoadingPie1()){
    <div class="flex justify-center">
      <p-progress-spinner ariaLabel="loading" />
    </div>
    } @else {
    <p-card class="h-full">
      <p-chart type="pie" [data]="pieData1" [options]="pieOptions1" width="400" height="400"> </p-chart>
    </p-card>
    }
  </div>
  <div class="col-12 md:col-6 lg:col-4">
    @if(isLoadingBar()){
    <div class="flex justify-center">
      <p-progress-spinner ariaLabel="loading" />
    </div>
    } @else {
    <p-card class="h-full">
      <p-chart type="bar" [data]="barData" [options]="barOptions">
      </p-chart>
    </p-card>
    }
  </div>
  <div class="col-12 md:col-6 lg:col-4">
    @if(isLoadingPie2()){
    <div class="flex justify-center">
      <p-progress-spinner ariaLabel="loading" />
    </div>
    } @else {
    <p-card class="h-full">
      <p-chart type="pie" [data]="pieData2" [options]="pieOptions2" width="400" height="400"> </p-chart>
    </p-card>
    }
  </div>

</div>
