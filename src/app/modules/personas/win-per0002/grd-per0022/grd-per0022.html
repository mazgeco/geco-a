<p-toast />
<p-confirmdialog />
<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      <p-button
        id="btnGrdPer00221"
        icon="pi pi-plus"
        class="mr-1"
        label="Insertar"
        pTooltip="Inserta una fila"
        tooltipPosition="bottom"
        (onClick)="insertarFila()"
      />
      <p-button
        id="btnGrdPer00222"
        icon="pi pi-trash"
        class="mr-1"
        label="Eliminar"
        pTooltip="Elimina varias filas seleccionadas"
        tooltipPosition="bottom"
        (onClick)="eliminarVariasFilas()"
      />
      <p-button
        id="btnGrdPer00223"
        icon="pi pi-refresh"
        class="mr-1"
        pTooltip="Refresca los datos del grid"
        tooltipPosition="bottom"
        (onClick)="cargaDatos()"
      />
      <p-button
        id="btnGrdPer00224"
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
        (onClick)="muestraAuditoriaRegistro()"
      />
      <p-button
        id="btnGrdPer00225"
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())"
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      @if (barraMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="barraMessage()!.severity" [icon]="barraMessage()!.icon">
            {{ barraMessage()!.text }}
          </p-message>
        </div>
      }
    </ng-template>
  </p-toolbar>
  <!-- ===================================== -->
  <!-- LISTADO DE DATOS -->
  <!-- ===================================== -->
  <p-table
    id="grdPer0022"
    [value]="filas()"
    editMode="row"
    selectionMode="multiple"
    [(selection)]="selectedRows"
    [metaKeySelection]="metaKey"
    dataKey="_rowId"
    class="p-datatable-sm"
    [paginator]="true"
    [rows]="10"
    showGridlines
    [size]="'small'"
  >
    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 20%">Código</th>
        <th style="width: 70%">Tipo de empresa</th>
        <th style="width: 10%"></th>
      </tr>
    </ng-template>
    <!-- BODY -->
    <ng-template pTemplate="body" let-rowData let-editing="editing" let-rowIndex="rowIndex">
      <tr [pEditableRow]="rowData" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
        <!-- CODIGO -->
        <td>
          <p-cellEditor>
            <!-- INPUT -->
            <ng-template pTemplate="input">
              <input pInputText type="text" [(ngModel)]="rowData.idTipoEmpresa" class="w-full" />
            </ng-template>
            <!-- OUTPUT -->
            <ng-template pTemplate="output">
              {{ rowData.idTipoEmpresa }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- DESCRIPCIÓN -->
        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input
                pInputText
                type="text"
                [(ngModel)]="rowData.descripcionTipoEmpresa"
                class="w-full"
              />
            </ng-template>
            <ng-template pTemplate="output">
              {{ rowData.descripcionTipoEmpresa }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- ACCIONES -->
        <td class="text-center">
          <!-- EDITAR -->
          @if (!editing) {
            <button
              pButton
              [id]="'btnGrdPer00226' + rowIndex"
              pInitEditableRow
              icon="pi pi-pencil"
              text
              rounded
              severity="primary"
            ></button>
            <button
              pButton
              [id]="'btnGrdPer00227' + rowIndex"
              icon="pi pi-trash"
              text
              rounded
              severity="danger"
              (click)="eliminarFila(rowData)"
            ></button>
          }
          <!-- GUARDAR / CANCELAR -->
          @if (editing) {
            <button
              pButton
              [id]="'btnGrdPer00228' + rowIndex"
              pSaveEditableRow
              icon="pi pi-check"
              text
              rounded
              severity="success"
              class="mr-1"
              (click)="saveRow(rowData)"
            ></button>
            <button
              pButton
              [id]="'btnGrdPer00229' + rowIndex"
              pCancelEditableRow
              icon="pi pi-times"
              text
              rounded
              severity="danger"
            ></button>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
