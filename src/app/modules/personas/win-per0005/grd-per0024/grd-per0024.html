<p-toast />
<p-confirmdialog />
<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      <p-button
        id="btnGrdPer00241"
        icon="pi pi-plus"
        class="mr-1"
        label="Insertar"
        pTooltip="Inserta una fila"
        tooltipPosition="bottom"
        (onClick)="insertarFila()"
      />
      <p-button
        id="btnGrdPer00242"
        icon="pi pi-trash"
        class="mr-1"
        label="Eliminar"
        pTooltip="Elimina varias filas seleccionadas"
        tooltipPosition="bottom"
        (onClick)="eliminarVariasFilas()"
      />
      <p-button
        id="btnGrdPer00243"
        icon="pi pi-refresh"
        class="mr-1"
        pTooltip="Refresca los datos del grid"
        tooltipPosition="bottom"
        (onClick)="cargaDatos()"
      />
      <p-button
        id="btnGrdPer00244"
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
        (onClick)="muestraAuditoriaRegistro()"
      />
      <p-button
        id="btnGrdPer00245"
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())"
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      @if (barraMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="barraMessage()!.severity" [icon]="barraMessage()!.icon">
            {{ barraMessage()!.text }}
          </p-message>
        </div>
      }
    </ng-template>
  </p-toolbar>
  <!-- ===================================== -->
  <!-- LISTADO DE DATOS -->
  <!-- ===================================== -->
  <p-table
    id="grdPer0024"
    [value]="filas()"
    editMode="row"
    selectionMode="multiple"
    [(selection)]="selectedRows"
    [metaKeySelection]="metaKey"
    dataKey="_rowId"
    class="p-datatable-sm"
    [paginator]="true"
    [rows]="10"
    showGridlines
    [size]="'small'"
  >
    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 25%">Código</th>
        <th style="width: 30%">Tipo identificación</th>
        <th style="width: 10%"></th>
      </tr>
    </ng-template>
    <!-- BODY -->
    <ng-template pTemplate="body" let-rowData let-editing="editing" let-rowIndex="rowIndex">
      <tr [pEditableRow]="rowData" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
        <!-- CODIGO -->
        <td>
          <p-cellEditor>
            <!-- INPUT -->
            <ng-template pTemplate="input">
              <input
                pInputText
                type="text"
                [(ngModel)]="rowData.idTipoIdentificacion"
                class="w-full"
              />
            </ng-template>
            <!-- OUTPUT -->
            <ng-template pTemplate="output">
              {{ rowData.idTipoIdentificacion }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- DESCRIPCIÓN -->
        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input
                pInputText
                type="text"
                [(ngModel)]="rowData.descripcionTipoIdentificacion"
                class="w-full"
              />
            </ng-template>
            <ng-template pTemplate="output">
              {{ rowData.descripcionTipoIdentificacion }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- ACCIONES -->
        <td class="text-center">
          <!-- EDITAR -->
          @if (!editing) {
            <button
              pButton
              [id]="'btnGrdPer00246' + rowIndex"
              pInitEditableRow
              icon="pi pi-pencil"
              text
              rounded
              severity="primary"
            ></button>
            <button
              pButton
              [id]="'btnGrdPer00247' + rowIndex"
              icon="pi pi-trash"
              text
              rounded
              severity="danger"
              (click)="eliminarFila(rowData)"
            ></button>
          }
          <!-- GUARDAR / CANCELAR -->
          @if (editing) {
            <button
              pButton
              [id]="'btnGrdPer00248' + rowIndex"
              pSaveEditableRow
              icon="pi pi-check"
              text
              rounded
              severity="success"
              class="mr-1"
              (click)="saveRow(rowData)"
            ></button>
            <button
              pButton
              [id]="'btnGrdPer00249' + rowIndex"
              pCancelEditableRow
              icon="pi pi-times"
              text
              rounded
              severity="danger"
            ></button>
          }
        </td>
      </tr>
    </ng-template>
    <!-- FOOTER -->
    <ng-template pTemplate="paginatorleft"> {{ filas().length }} ítems </ng-template>
  </p-table>
</div>
