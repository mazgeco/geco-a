<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      <p-button id="btnGrdPer00191" icon="pi pi-plus" class="mr-1" label="Insertar" pTooltip="Activa a la persona"
        tooltipPosition="bottom" (onClick)="insertarTelefono()" />
      <p-button id="btnGrdPer00192" icon="pi pi-trash" class="mr-1" label="Eliminar"
        pTooltip="Elimina varias filas seleccionadas" tooltipPosition="bottom" (onClick)="eliminarVarias()" />
      <p-button id="btnGrdPer00193" icon="pi pi-refresh" class="mr-1" pTooltip="Refresca los datos del grid"
        tooltipPosition="bottom" (onClick)="cargaTelefonos()" />
      <p-button id="btnGrdPer00194" icon="pi pi-user" class="mr-1" pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom" (onClick)="muestraAuditoriaRegistro()" />
      <p-button id="btnGrdPer00195" icon="pi pi-info-circle" pTooltip="Información del objeto actual"
        tooltipPosition="bottom" (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())" />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      @if (telefonoMessage()?.visible) {
      <div class="message-container">
        <p-message [severity]="telefonoMessage()!.severity" [icon]="telefonoMessage()!.icon">
          {{ telefonoMessage()!.text }}
        </p-message>
      </div>
      }
    </ng-template>

  </p-toolbar>
  <!-- ===================================== -->
  <!-- LISTADO IDENTIFICACIONES -->
  <!-- ===================================== -->
  <p-table id="GrdPer0019" [value]="telefonos()" editMode="row" selectionMode="multiple"
    [(selection)]="selectedRows" [metaKeySelection]="metaKey" dataKey="idTelefono" class="p-datatable-sm"
    [paginator]="true" [rows]="10" showGridlines [size]="'small'">
    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 25%">Tipo</th>
        <th style="width: 30%">Teléfono</th>
        <th style="width: 10%">Preferido</th>
        <th style="width: 10%"></th>
      </tr>
    </ng-template>
    <!-- BODY -->
    <ng-template pTemplate="body" let-rowData let-editing="editing" let-rowIndex="rowIndex">
      <tr [pEditableRow]="rowData" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
        <!-- TIPO -->
        <td>
          <p-cellEditor>
            <!-- INPUT -->
            <ng-template pTemplate="input">
              <p-select [options]="tipoTelefonos()" optionLabel="descripcionTipoTelefono" optionValue="idTipoTelefono"
                [(ngModel)]="rowData.idTipoTelefono" placeholder="Seleccione" class="w-full" appendTo="body" />
            </ng-template>
            <!-- OUTPUT -->
            <ng-template pTemplate="output">
              {{ funciones.obtenerEtiqueta(tipoTelefonos(), rowData.idTipoTelefono, 'tipoTelefono') }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- IDENTIFICACION -->
        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input pInputText type="text" [(ngModel)]="rowData.descripcionTelefono" class="w-full" />
            </ng-template>
            <ng-template pTemplate="output">
              {{ rowData.descripcionTelefono }}
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- PREFERIDO -->
        <td class="text-center">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <p-checkbox [binary]="true" [ngModel]="rowData.principalTelefono === 'S'"
                (ngModelChange)="rowData.principalTelefono = $event ? 'S' : 'N'">
              </p-checkbox>
            </ng-template>
            <ng-template pTemplate="output">
              <i class="pi"
                [ngClass]="rowData.principalTelefono == 'S' ? 'pi-check-circle text-green-500' : 'pi-circle'"></i>
            </ng-template>
          </p-cellEditor>
        </td>
        <!-- ACCIONES -->
        <td class="text-center">
          <!-- EDITAR -->
          @if (!editing) {
          <button pButton [id]="'btnGrdPer00195' + rowData.idTelefono" pInitEditableRow icon="pi pi-pencil" text
            rounded severity="primary"></button>
          <button pButton [id]="'btnGrdPer00196' + rowData.idTelefono" icon="pi pi-trash" text rounded
            severity="danger" (click)="eliminarTelefono(rowData)"></button>
          }
          <!-- GUARDAR / CANCELAR -->
          @if (editing) {
          <button pButton [id]="'btnGrdPer00197' + rowData.idTelefono" pSaveEditableRow icon="pi pi-check" text
            rounded severity="success" class="mr-1" (click)="saveTelefono(rowData)"></button>
          <button pButton [id]="'btnGrdPer00198' + rowData.idTelefono" pCancelEditableRow icon="pi pi-times" text
            rounded severity="danger"></button>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
