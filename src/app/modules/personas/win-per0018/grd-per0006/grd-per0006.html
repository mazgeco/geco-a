<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      <p-button id="btnGrdPer00101" icon="pi pi-plus" class="mr-1" label="Insertar" pTooltip="Activa a la persona"
        tooltipPosition="bottom" (onClick)="insertarDireccion()" />
      <p-button id="btnGrdPer00102" icon="pi pi-trash" class="mr-1" label="Eliminar"
        pTooltip="Elimina varias filas seleccionadas" tooltipPosition="bottom" (onClick)="eliminarVarias()" />
      <p-button id="btnGrdPer00103" icon="pi pi-refresh" class="mr-1" pTooltip="Refresca los datos del grid"
        tooltipPosition="bottom" (onClick)="cargaDirecciones()" />
      <p-button id="btnGrdPer00104" icon="pi pi-user" class="mr-1" pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom" (onClick)="muestraAuditoriaRegistro()" />
      <p-button id="btnGrdPer00105" icon="pi pi-info-circle" pTooltip="Información del objeto actual"
        tooltipPosition="bottom" (onClick)="muestraInfoObjeto()" />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      <span></span>
    </ng-template>

  </p-toolbar>
  <!-- ===================================== -->
  <!-- LISTADO DIRECCIONES -->
  <!-- ===================================== -->
  <p-table id="grdPer0006" [value]="direcciones()" editMode="row" selectionMode="multiple" [(selection)]="selectedRows"
    [metaKeySelection]="metaKey" dataKey="idDireccion" class="p-datatable-sm" [paginator]="true" [rows]="10"
    showGridlines [size]="'small'">
    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 25%">Tipo</th>
        <th style="width: 30%">Descripción</th>
        <th style="width: 10%">Preferido</th>
        <th style="width: 10%"></th>
      </tr>
    </ng-template>
    <!-- BODY -->
    <ng-template pTemplate="body" let-rowData let-editing="editing" let-rowIndex="rowIndex">
      <tr [pEditableRow]="rowData" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
        <td>{{ rowData.idTipoDireccion === 'D' ? 'Domicilio' : 'Oficina' }}</td>
        <td> {{ rowData.descripcionDireccion }} </td>
        <td>{{ rowData.principalDireccion === 'S' ? 'Si' : 'No' }}</td>
        <!-- ACCIONES -->
        <td class="text-center">
          <!-- EDITAR -->
          @if (!editing) {
          <button pButton [id]="'btnGrdPer00105' + rowData.idIdentificacion" pInitEditableRow icon="pi pi-pencil" text
            rounded severity="primary"></button>
          <button pButton [id]="'btnGrdPer00106' + rowData.idIdentificacion" icon="pi pi-trash" text rounded
            severity="danger" (click)="eliminarDireccion(rowData)"></button>
          }
          <!-- GUARDAR / CANCELAR -->
          @if (editing) {
          <button pButton [id]="'btnGrdPer00107' + rowData.idIdentificacion" pSaveEditableRow icon="pi pi-check" text
            rounded severity="success" class="mr-1"></button>
          <button pButton [id]="'btnGrdPer00108' + rowData.idIdentificacion" pCancelEditableRow icon="pi pi-times" text
            rounded severity="danger"></button>
          }
        </td>
      </tr>
      @if (editing) {
      <tr>
        <td colspan="4">
          <form>
            <p-panel class="col-12">
              <div class="grid">
                <!-- ======================= -->
                <!-- FILA 1 -->
                <!-- ======================= -->
                <div class="col-12 md:col-6">
                  <div class="field mb-1">
                    <label>Tipo de dirección</label>
                    <input pInputText class="w-full">
                  </div>
                </div>
                <div class="col-12 md:col-6">
                  <div class="field mb-1">
                    <label>Ciudad</label>
                    <input pInputText class="w-full">
                  </div>
                </div>
                <!-- ======================= -->
                <!-- FILA 2 -->
                <!-- ======================= -->
                <div class="col-12 md:col-6">
                  <div class="field mb-1">
                    <label>Sector</label>
                    <input pInputText class="w-full">
                  </div>
                </div>
                <div class="col-12 md:col-6">
                  <div class="field mb-1">
                    <label>Código alfanumérico</label>
                    <input pInputText class="w-full">
                  </div>
                </div>
              </div>
            </p-panel>


          </form>
        </td>
      </tr>
      }
    </ng-template>

  </p-table>

</div>
