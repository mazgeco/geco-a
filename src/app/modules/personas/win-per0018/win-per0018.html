<p-toast />
<p-confirmdialog />

<p-toolbar>
  <ng-template #start>
    <label class="font-bold">
      COD. {{ idPersona() }}
    </label>
  </ng-template>
  <ng-template #center>
    <label class="font-bold razonSocial">
      {{ stateService.nombre() }}
    </label>
  </ng-template>
  <ng-template #end>
    <label class="font-bold" [style.color]="stateService.estado() ? '#4caf50' : '#f44336'">
      {{ stateService.estadoNombre() }}
    </label>
  </ng-template>
</p-toolbar>


<p-tabs value="0">
  <p-tablist>
    <p-tab value="0">Datos generales</p-tab>
    <p-tab value="1">Identificaciones</p-tab>
    <p-tab value="2">Direcciones</p-tab>
    <p-tab value="3">Teléfonos</p-tab>
    <p-tab value="4">Características</p-tab>
    <p-tab value="5">Ficha médica</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="0">
      <app-frm-per0001 [idPersona]="idPersona()" />
    </p-tabpanel>
    <p-tabpanel value="1">
      <!-- Identificaciones -->
      <app-grd-per0010 [idPersona]="idPersona()" />
    </p-tabpanel>
    <p-tabpanel value="2">
      <!-- Direcciones -->
      <app-grd-per0006 [idPersona]="idPersona()" />
    </p-tabpanel>
    <p-tabpanel value="3">
      <!-- Teléfonos -->
      <app-grd-per0019 [idPersona]="idPersona()" />
    </p-tabpanel>
    <p-tabpanel value="4">
      <!-- Características -->
      <app-grd-per0002 [idPersona]="idPersona()" />
    </p-tabpanel>
    <p-tabpanel value="5">
      <!-- Ficha Médica -->
      <app-grd-per0008 [idPersona]="idPersona()" />
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
