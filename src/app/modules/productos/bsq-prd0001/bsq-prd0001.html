<p-toolbar>
  <ng-template #start>
    <p-button label="Nuevo" (onClick)="openProducto()"></p-button>
  </ng-template>
  <ng-template #center>
    <p-iconfield iconPosition="left">
      <p-inputicon class="pi pi-search" />
      <input type="text" pInputText placeholder="Search" #searchInput (change)="buscarProducto(searchInput.value)" />
    </p-iconfield>
  </ng-template>
  <ng-template #end>
     @if (busquedaMessage()?.visible) {
    <div class="message-container">
      <p-message [severity]="busquedaMessage()!.severity" [icon]="busquedaMessage()!.icon">
        {{ busquedaMessage()!.text }}
      </p-message>
    </div>
    }
  </ng-template>
</p-toolbar>
<p-toast></p-toast>

@if(loading()){
<div class="flex justify-center">
  <p-progress-spinner ariaLabel="loading" />
</div>
} @else {
<div class="grid m-3">
  @for (producto of productos(); track producto.idProducto) {
  <div class="col-12 md:col-6 lg:col-4 xl:col-3">
    <p-card class="resultado-card h-full cursor-pointer" (click)="seleccionarProducto(producto)">
      <ng-template #title>
        <div class="font-semibold text-sm">
          {{ producto.nombreCorto }}
        </div>
      </ng-template>
      <div class="text-sm">
        <div>
          <span class="font-semibold">Código:</span>
          {{ producto.idProducto  }}
        </div>
        <div>
           <span class="font-semibold">Estado:</span>
          <span class="font-semibold" [style.color]="producto.estadoProducto === 'A' ? '#4caf50' : '#f44336'">
            {{ producto.estadoProducto === 'A' ? 'ACTIVO' : 'INACTIVO' }}
          </span>
        </div>
      </div>
    </p-card>
  </div>
  }
</div>
}
