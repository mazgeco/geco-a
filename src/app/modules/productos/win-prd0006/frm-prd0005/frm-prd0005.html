<p-toast />
<p-confirmdialog />

<div class="col-12">
     <p-toolbar>
    <ng-template #start>
      <p-button
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
      />
      <p-button
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())"
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
       @if (productoMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="productoMessage()!.severity" [icon]="productoMessage()!.icon">
            {{ productoMessage()!.text }}
          </p-message>
        </div>
      }
    </ng-template>
  </p-toolbar>
<form id="frmPrd0005" class="grid m-0" [formGroup]="frmPrd0005">
  <p-panel class="col-12">
  <!-- Encabezado de la sección -->
  <div class="flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="m-0">Asociación de Impuestos y Tasas</h3>
                <p class="text-color-secondary text-sm m-0 mt-1">Selección de tributos obligatorios y locales aplicables al producto.</p>
            </div>
        </div>

<!-- Cuadrícula de tarjetas -->
<div class="grid">    
    <!-- TARJETA DINÁMICA (Se repetirá por cada impuesto activo) -->
   <div *ngFor="let impuesto of listaImpuestosActivos" class="col-12 md:col-6">
        
        <!-- 1. Eliminamos 'h-full' y 'justify-content-between'. Cambiamos 'p-4' por 'p-3' -->
        <div class="surface-card border-1 surface-border border-round-xl p-3 flex flex-column cursor-pointer"
             [ngClass]="{'border-primary bg-blue-50': isSeleccionado(impuesto.idImpuesto)}">
            
            <!-- Cabecera (Checkbox y Nombre) -->
            <div class="flex align-items-center gap-3">
                <p-checkbox 
                    [value]="impuesto.idImpuesto" 
                    formControlName="impuestosSeleccionados"
                    (onChange)="verificarCambioCheckbox(impuesto.idImpuesto)">
                </p-checkbox>
                
                <div>
                    <span class="font-bold text-900 text-base block">{{ impuesto.descripcionImpuesto }}</span>
                </div>
            </div>

            <!-- Etiquetas inferiores (Tarifa y Badges) -->
            <div class="flex align-items-center gap-2 mt-3">
                <span class="surface-ground px-2 py-1 border-round text-xs font-semibold text-700">
                    Tarifa: {{ impuesto.tipoValor === 'V' ? 'Variable' : impuesto.cantidadImpuesto }}
                </span>
              
            </div>
            
            <!-- 2. Recuadro de valor más compacto (p-2, textos más pequeños, menos margen) -->
            <div *ngIf="impuesto.tipoValor === 'V' && isSeleccionado(impuesto.idImpuesto)" 
                 class="mt-3 p-2 surface-ground border-1 surface-border border-round"
                 formGroupName="valoresVariables">
                 
                <label class="block text-xs font-bold text-700 mb-1">
                    Digite el valor exacto ($):
                </label>
                
                <input type="number" 
                       pInputText 
                       class="w-full p-2 text-sm" 
                       placeholder="Ej: 1.60"
                       [formControlName]="impuesto.idImpuesto">
            </div>
            
        </div>
    </div>
</div>
</p-panel>
</form>
</div>
