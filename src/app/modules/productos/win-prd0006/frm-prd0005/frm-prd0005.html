<div [formGroup]="frmImpuestos" class="p-4">
  
  <!-- Encabezado de la sección -->
  <div class="mb-4">
    <h3 class="text-900 font-bold text-xl m-0">4. Asociación de Impuestos y Tasas</h3>
    <p class="text-600 text-sm m-0 mt-1">Selección de tributos obligatorios y locales aplicables al producto.</p>
  </div>

  <!-- Cuadrícula de tarjetas -->
  <div class="grid">
    
    <!-- Tarjeta 1: IVA (Seleccionada por defecto en tu ejemplo) -->
    <div class="col-12 md:col-6">
      <div class="surface-card border-1 surface-border border-round-xl p-4 h-full flex flex-column justify-content-between"
           [ngClass]="{'border-primary bg-blue-50': frmImpuestos.value.impuestosSeleccionados?.includes('IVA')}">
        
        <div class="flex align-items-center gap-3">
          <p-checkbox 
            value="IVA" 
            formControlName="impuestosSeleccionados">
          </p-checkbox>
          <div>
            <span class="font-bold text-900 text-base block">IVA (Impuesto al Valor Agregado)</span>
          </div>
        </div>

        <!-- Etiquetas inferiores (Tarifa y Badge) -->
        <div class="flex align-items-center gap-2 mt-3 pl-4">
          <span class="surface-ground px-2 py-1 border-round text-xs font-semibold text-700">Tarifa: 15%</span>
          <span class="bg-red-100 text-red-700 px-2 py-1 border-round text-xs font-bold">OBLIGATORIO SRI</span>
        </div>

      </div>
    </div>

    <!-- Tarjeta 2: Tasa Turística -->
    <div class="col-12 md:col-6">
      <div class="surface-card border-1 surface-border border-round-xl p-4 h-full flex flex-column justify-content-between"
           [ngClass]="{'border-primary bg-blue-50': frmImpuestos.value.impuestosSeleccionados?.includes('TASA_TURISTICA')}">
        
        <div class="flex align-items-center gap-3">
          <p-checkbox 
            value="TASA_TURISTICA" 
            formControlName="impuestosSeleccionados">
          </p-checkbox>
          <div>
            <span class="font-bold text-900 text-base block">Tasa Turística Municipal pernoctación</span>
          </div>
        </div>

        <div class="flex align-items-center gap-2 mt-3 pl-4">
          <span class="surface-ground px-2 py-1 border-round text-xs font-semibold text-700">Tarifa: USD 2.50</span>
        </div>

      </div>
    </div>

    <!-- Tarjeta 3: Galápagos -->
    <div class="col-12 md:col-6">
      <div class="surface-card border-1 surface-border border-round-xl p-4 h-full flex flex-column justify-content-between"
           [ngClass]="{'border-primary bg-blue-50': frmImpuestos.value.impuestosSeleccionados?.includes('GALAPAGOS')}">
        
        <div class="flex align-items-center gap-3">
          <p-checkbox 
            value="GALAPAGOS" 
            formControlName="impuestosSeleccionados">
          </p-checkbox>
          <div>
            <span class="font-bold text-900 text-base block">Tributo Ingreso Parque Nacional Galápagos</span>
          </div>
        </div>

        <div class="flex align-items-center gap-2 mt-3 pl-4">
          <span class="surface-ground px-2 py-1 border-round text-xs font-semibold text-700">Tarifa: USD 100.00</span>
        </div>

      </div>
    </div>

  </div>
</div>
