<p-toast />
<p-confirmdialog />

<div class="col-12">
  <p-toolbar>
    <ng-template #start>

      <p-button
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
   
      />
      <p-button
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
       
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
       <!-- @if (productoMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="productoMessage()!.severity" [icon]="productoMessage()!.icon">
            {{ productoMessage()!.text }}
          </p-message>
        </div>
      } -->
    </ng-template>
  </p-toolbar>
  <p-panel class="col-12">
    
        <!-- ========================================== -->
        <!-- CABECERA DE LA PESTAÑA                     -->
        <!-- ========================================== -->
        <div class="flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="m-0">Matriz de Tarifas</h3>
                <p class="text-color-secondary text-sm m-0 mt-1">Define el modelo comercial del producto (Estacional con validación de rangos o Tarifa Plana Única).</p>
            </div>
        </div>
     <!-- SECCIÓN 1: MODELOS DE COBRO (Tarjetas) -->
    <div class="surface-card border-1 surface-border border-round-2xl p-4 mb-4">
        <label class="block font-bold mb-3 text-sm text-600 uppercase">Modelo de cobro del producto (Mutuamente excluyente) *</label>
        
        <div class="grid">
            <!-- Tarjeta Modelo 1 -->
            <div class="col-12 md:col-6">
                <div class="p-3 border-round-xl border-2 cursor-pointer flex align-items-center gap-3 transition-colors transition-duration-200"
                     [ngClass]="{'border-primary bg-blue-50': modeloCobro === 1, 'surface-border surface-card': modeloCobro !== 1}"
                     (click)="modeloCobro = 1">
                    <p-radioButton name="modelo" [value]="1" [(ngModel)]="modeloCobro"></p-radioButton>
                    <div>
                        <div class="font-bold mb-1 text-900 text-sm">1. MODELO ESTACIONAL (POR RANGOS DE PAX)</div>
                        <div class="text-sm text-500">Varía por número de pasajeros y temporada.</div>
                    </div>
                </div>
            </div>

            <!-- Tarjeta Modelo 2 -->
            <div class="col-12 md:col-6">
                <div class="p-3 border-round-xl border-2 cursor-pointer flex align-items-center gap-3 transition-colors transition-duration-200"
                     [ngClass]="{'border-primary bg-blue-50': modeloCobro === 2, 'surface-border surface-card': modeloCobro !== 2}"
                     (click)="modeloCobro = 2">
                    <p-radioButton name="modelo" [value]="2" [(ngModel)]="modeloCobro"></p-radioButton>
                    <div>
                        <div class="font-bold mb-1 text-900 text-sm">2. MODELO DE TARIFA PLANA (PRECIO FIJO ANUAL)</div>
                        <div class="text-sm text-500">Valor único e invariable los 365 días del año.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <app-grd-prd0011></app-grd-prd0011>
</p-panel>
 
</div>
