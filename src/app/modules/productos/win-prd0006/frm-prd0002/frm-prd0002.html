<p-toast />
<p-confirmdialog />

<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      @if (esActivo()) {
        <p-button
          icon="pi pi-check"
          class="mr-1"
          label="Inactivar"
          pTooltip="Inactiva al producto"
          tooltipPosition="bottom"
          (onClick)="cambiarEstado(EstadoProducto.I)"
        />
      } @else {
        <p-button
          icon="pi pi-check"
          class="mr-1"
          label="Activar"
          pTooltip="Activa al producto"
          tooltipPosition="bottom"
          (onClick)="cambiarEstado(EstadoProducto.A)"
        />
      }
      <p-button
        icon="pi pi-user"
        class="mr-1"
        pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraAuditoria(idProducto, idTabla(), currentData)"
      />
      <p-button
        icon="pi pi-info-circle"
        pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        (onClick)="funciones.muestraInfoObjeto(idContenedor(), idObjeto(), idTabla(), permiso())"
      />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
       @if (productoMessage()?.visible) {
        <div class="message-container">
          <p-message [severity]="productoMessage()!.severity" [icon]="productoMessage()!.icon">
            {{ productoMessage()!.text }}
          </p-message>
        </div>
      }
    </ng-template>
  </p-toolbar>
  <form id="frmPrd0002" class="grid m-0" [formGroup]="frmPrd0002">
    <!-- ====================================================== -->
    <!-- PANEL SUPERIOR -->
    <!-- ====================================================== -->
    <p-panel class="col-12">
      <div class="grid">
        <!-- ======================= -->
        <!-- FILA 1 -->
        <!-- ======================= -->

        <div class="col-12 md:col-6">
          <div class="field mb-1">
            <label>Tipo de Producto</label>
            <p-select
              class="w-full"
              [options]="nombreTipoProducto()"
              [filter]="true"
              formControlName="idTipoProducto"
              optionLabel="descripcionTipoProducto"
              optionValue="idTipoProducto"
            >
            </p-select>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="field mb-1">
            <label>Nombre comercial del Producto</label>
            <input
              pInputText
              class="w-full"
              formControlName="nombreCorto"
              [readOnly]="esActivo()"
            />
          </div>
        </div>

        <!-- ======================= -->
        <!-- FILA 2 -->
        <!-- ======================= -->
        <div class="col-12 md:col-6">
          <div class="field mb-1">
            <label>Destino principal</label>
            <input
              pInputText
              class="w-full"
              formControlName="destinoPrincipal"
              [readOnly]="esActivo()"
            />
          </div>
        </div>
        <div class="col-12 md:col-6">
          <div class="field mb-1">
            <label>Cuenta</label>
            <p-select
              class="w-full"
              [options]="opcionesCuentas()"
              [filter]="true"
              formControlName="idCuenta"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <!-- ======================= -->
        <!-- FILA 3 -->
        <!-- ======================= -->

        <div class="col-12">
          <div class="field mb-1">
            <label>Descripción del Producto</label>
            <textarea
              pTextarea
              [autoResize]="true"
              rows="4"
              class="w-full"
              formControlName="descripcionProducto"
              [readOnly]="esActivo()"
            >
            </textarea>           
          </div>
        </div>

        <!-- ======================= -->
        <!-- FILA 4 -->
        <!-- ======================= -->
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Tipo bien</label>
            <p-select
              class="w-full"
              [options]="opcionesTipoBien()"
              formControlName="tipoBien"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Individual/General</label>
            <p-select
              class="w-full"
              [options]="opcionesIndividualGeneral()"
              formControlName="individualGeneral"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Unidades de medida</label>
            <p-select
              class="w-full"
              [options]="opcionesUnidadesMedida()"
              formControlName="medidaCalculoPrecio"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <!-- ======================= -->
        <!-- FILA 5 -->
        <!-- ======================= -->
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Es espacio</label>
            <p-select
              class="w-full"
              [options]="opcionSN()"
              formControlName="esEspacio"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>#Espacios</label>
            <input
              pInputText
              class="w-full"
              formControlName="nroEspacios"
              [readOnly]="esActivo()"
            />
          </div>
        </div>
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Corta Itinerario</label>
            <p-select
              class="w-full"
              [options]="opcionSN()"
              formControlName="cortaItinerario"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <!-- ======================= -->
        <!-- FILA 6 -->
        <!-- ======================= -->

        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Se divide</label>
            <p-select
              class="w-full"
              [options]="opcionSN()"
              formControlName="seDivide"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <!-- ======================= -->
        <!-- FILA 7 -->
        <!-- ======================= -->
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Se reserva</label>
            <p-select
              class="w-full"
              [options]="opcionSN()"
              formControlName="seReserva"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Bloquea horario</label>
            <p-select
              class="w-full"
              [options]="opcionSN()"
              formControlName="bloqueaHorario"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <!-- ======================= -->
        <!-- FILA 8 -->
        <!-- ======================= -->
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Depende de itinerario</label>
            <p-select
              class="w-full"
              [options]="opcionSN()"
              formControlName="dependeItinerario"
              optionLabel="etiqueta"
              optionValue="codigo"
            >
            </p-select>
          </div>
        </div>
        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Capacidad minima</label>
            <input
              pInputText
              type="number"
              min="0"
              class="w-full"
              formControlName="capacidadMinima"
              [readOnly]="esActivo()"
            />
          </div>
        </div>

        <div class="col-12 md:col-4">
          <div class="field mb-1">
            <label>Capacidad maxima</label>
            <input
              pInputText
              type="number"
              min="0"
              class="w-full"
              formControlName="capacidadMaxima"
              [readOnly]="esActivo()"
            />
          </div>
        </div>
        <!-- ======================= -->
        <!-- FILA 9 -->
        <!-- ======================= -->
        <!-- Notas del Producto -->
        <div class="col-12">
          <div class="field mb-1">
            <label>Notas:</label>
            <textarea pTextarea [autoResize]="true" rows="4" class="w-full" formControlName="notas"> </textarea>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
