<div class="col-12">
  <p-toolbar>
    <ng-template #start>
      <p-button id="btnGrdPrd00061" icon="pi pi-plus" class="mr-1" label="Insertar" pTooltip="Agrega un insumo al día"
        tooltipPosition="bottom" (onClick)="insertarFila()" />
      <p-button id="btnGrdPrd00062" icon="pi pi-trash" class="mr-1" label="Eliminar"
        pTooltip="Elimina varias filas seleccionadas" tooltipPosition="bottom"  />
      <p-button id="btnGrdPrd00063" icon="pi pi-refresh" class="mr-1" pTooltip="Refresca los datos del grid"
        tooltipPosition="bottom"  />
      <p-button id="btnGrdPrd00064" icon="pi pi-user" class="mr-1" pTooltip="Auditoría del registro actual"
        tooltipPosition="bottom"  />
      <p-button id="btnGrdPrd00065" icon="pi pi-info-circle" pTooltip="Información del objeto actual"
        tooltipPosition="bottom"
        />
    </ng-template>

    <ng-template #center>
      <span></span>
    </ng-template>

    <ng-template #end>
      <!-- @if (barraMessage()?.visible) {
      <div class="message-container">
        <p-message [severity]="barraMessage()!.severity" [icon]="barraMessage()!.icon">
          {{ barraMessage()!.text }}
        </p-message>
      </div>
      } -->
    </ng-template>
  </p-toolbar>
<p-table id="GrdPrd0011" [value]="fila()" editMode="row" selectionMode="multiple"
     dataKey="idPrecioProducto" class="p-datatable-sm"
    [paginator]="true" [rows]="10" showGridlines [size]="'small'">
    
    <!-- HEADER (Actualizado con las 7 columnas) -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 30%">Nombre Tarifa</th>
        <th style="width: 10%">Pax Min</th>
        <th style="width: 10%">Pax Max</th>
        <th style="width: 10%">Costo Base($)</th>
        <th style="width: 10%" >Tarifa RAC</th>
        <th style="width: 10%" class="text-center">Acciones</th>
      </tr>
    </ng-template>
    
    <!-- BODY (Con los p-select) -->
    <ng-template pTemplate="body" let-rowData let-editing="editing" let-rowIndex="rowIndex">
      <tr [pEditableRow]="rowData" [pSelectableRow]="rowData" [pSelectableRowIndex]="rowIndex">
        
       <!-- 1. NOMBRE TARIFA (descripcion) -->
<td>
  <p-cellEditor>
    <ng-template pTemplate="input">
      <input pInputText type="text" [(ngModel)]="rowData.descripcionPrecioProductoXTemporada" class="w-full">
    </ng-template>
    <ng-template pTemplate="output">
      {{ rowData.descripcionPrecioProductoXTemporada }}
    </ng-template>
  </p-cellEditor>
</td>

<!-- 2. PAX MIN (paxMin) -->
<td>
  <p-cellEditor>
    <ng-template pTemplate="input">
      <p-inputNumber [(ngModel)]="rowData.paxIni" [useGrouping]="false" class="w-full"></p-inputNumber>
    </ng-template>
    <ng-template pTemplate="output">
      {{ rowData.paxIni }}
    </ng-template>
  </p-cellEditor>
</td>

<!-- 3. PAX MAX (paxMax) -->
<td>
  <p-cellEditor>
    <ng-template pTemplate="input">
      <p-inputNumber [(ngModel)]="rowData.paxFin" [useGrouping]="false" class="w-full"></p-inputNumber>
    </ng-template>
    <ng-template pTemplate="output">
      {{ rowData.paxFin }}
    </ng-template>
  </p-cellEditor>
</td>

<!-- 4. COSTO BASE (costoBase) -->
<td>
  <p-cellEditor>
    <ng-template pTemplate="input">
      <p-inputNumber [(ngModel)]="rowData.precio" mode="decimal" [minFractionDigits]="2" class="w-full"></p-inputNumber>
    </ng-template>
    <ng-template pTemplate="output">
      {{ rowData.precio | number:'1.2-2' }}
    </ng-template>
  </p-cellEditor>
</td>

<!-- 5. TARIFA RAC (tarifaRac) -->
<td>
  <p-cellEditor>
    <ng-template pTemplate="input">
      <p-inputNumber [(ngModel)]="rowData.tarifaRac" mode="decimal" [minFractionDigits]="2" class="w-full"></p-inputNumber>
    </ng-template>
    <ng-template pTemplate="output">
      {{ rowData.tarifaRac | number:'1.2-2' }}
    </ng-template>
  </p-cellEditor>
</td>


        <!-- 7. ACCIONES -->
        <td class="text-center">
          @if (!editing) {
          <button pButton [id]="'btnGrdPrd0011' + rowData.idPrecioProducto" pInitEditableRow icon="pi pi-pencil" text
            rounded severity="primary"></button>
          <button pButton [id]="'btnGrdPrd00066' + rowData.idItinerarioInsumo" icon="pi pi-trash" text rounded
            severity="danger" ></button>
          }
          @if (editing) {
          <button pButton [id]="'btnGrdPrd00067' + rowData.idItinerarioInsumo" pSaveEditableRow icon="pi pi-check" text
            rounded severity="success" class="mr-1" ></button>
          <button pButton [id]="'btnGrdPrd00068' + rowData.idItinerarioInsumo" pCancelEditableRow icon="pi pi-times" text
            rounded severity="danger"></button>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>



  </div>
